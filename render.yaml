# Render blueprint: one web service. The database is Neon (or any Postgres
# with btree_gist); paste its connection string as DATABASE_URL.
services:
  - type: web
    name: mezbaan
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
